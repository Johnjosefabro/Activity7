<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabro's Creatives</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eee;
            text-align: center;
            min-height: 100vh;
        }

    
        header {
            background-color: #000;
            min-height: 18vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid gold;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: white;
        }

   
        nav {
            background-color: #222;
            padding: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: gold;
        }

    
        .card {
            background-color: white;
            width: 70%;
            min-height: 58vh;
            margin: 3vh auto;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease,
             box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

       
        .images {
            margin-bottom: 10px;
        }

        .images img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid gold;
            margin: 5px;

           
            transition: transform 0.4s ease,
                        box-shadow 0.4s ease,
                        filter 0.4s ease;
        }

        .images img:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 0 20px gold;
            filter: brightness(1.15);
        }

        h2 {
            font-size: 32px;
            margin: 10px;
        }

        .tagline {
            color: goldenrod;
            font-style: italic;
            font-size: 18px;
        }

        .description {
            line-height: 1.6;
        }

       
        .learn-more {
            display: inline-block;
            background-color: #222;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            margin-top: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .learn-more:hover {
            background-color: gold;
            color: black;
        }

        
        footer {
            background-color: black;
            color: white;
            padding: 20px;
        }

       
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                min-height: auto;
            }

            header h1 {
                font-size: 24px;
            }

            nav {
                padding: 15px 5px;
            }

            nav a {
                display: block;
                margin: 10px 0;
            }

            .card {
                width: 90%;
                min-height: auto;
                margin: 20px auto;
            }

            h2 {
                font-size: 26px;
            }

            .images img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    
    <header>
        <img class="logo" src="FINAL LOGO.png" alt="Fabro's Creatives Logo">
        <h1>FABRO'S CREATIVES</h1>
    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="gallery.html">GALLERY</a>
        <a href="contact.html">CONTACT</a>
    </nav>


    <main>
        <div class="card">

            <h2>EXPERIENCE THE CREATIVE</h2>

            <p class="tagline">
                Creativity starts with imagination.
            </p>

            <div class="images">
                <img src="unnamed.jpg" alt="Creator">
                <img src="unnamed.jpg" alt="Creator">
                <img src="unnamed.jpg" alt="Creator">
            </div>

            <p class="description">
                Welcome to Fabro's Creatives!<br>
                This is a space where ideas, creativity,
                and passion come together.
            </p>

            <a href="about.html" class="learn-more">
                LEARN MORE
            </a>

        </div>
    </main>

    <footer>
        <p>© 2026 Fabro's Creatives</p>
    </footer>

</body>
</html>
